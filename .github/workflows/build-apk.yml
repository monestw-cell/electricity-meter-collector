name: Build arm64-v8a APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger directly from GitHub

jobs:
  build:
    name: Build and Package arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK (arm64-v8a)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Print Generated Build Artifacts
        run: |
          echo "Finding produced APKs:"
          find app/build/outputs/apk/ -name "*.apk"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
